name: smartline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/mosquitto/entrypoint.sh"]
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD}
      MQTT_FIRMWARE_PASSWORD: ${MQTT_FIRMWARE_PASSWORD}
      MQTT_VISION_PASSWORD: ${MQTT_VISION_PASSWORD}
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - ./infra/mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/ca.crt:/mosquitto/cert-source/ca.crt:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/mosquitto.crt:/mosquitto/cert-source/mosquitto.crt:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/mosquitto.key:/mosquitto/cert-source/mosquitto.key:ro
      - mosquitto_data:/mosquitto/data
    tmpfs:
      - /mosquitto/runtime:size=1m,mode=0700
    ports:
      - "8883:8883"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: SmartLine.API/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 5047
      ASPNETCORE_HTTPS_PORTS: 5443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/smartline/certs/smartline.local.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /run/smartline/certs/smartline.local.key
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Mqtt__BrokerAddress: mosquitto
      Mqtt__Port: 8883
      Mqtt__ClientId: smartline-api
      Mqtt__Username: smartline-api
      Mqtt__Password: ${MQTT_API_PASSWORD}
      Mqtt__CaCertificatePath: /run/smartline/certs/ca.crt
      Mqtt__ClientCertificatePath: /run/smartline/certs/smartline-api.crt
      Mqtt__ClientKeyPath: /run/smartline/certs/smartline-api.key
      Vision__HealthUrl: http://vision:8090/health
      Vision__CaptureTimeoutSeconds: ${VISION_CAPTURE_TIMEOUT_SECONDS:-35}
      Dataset__Root: /var/lib/smartline/datasets
    volumes:
      - api_datasets:/var/lib/smartline/datasets
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/ca.crt:/run/smartline/cert-source/ca.crt:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/smartline-api.crt:/run/smartline/cert-source/smartline-api.crt:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/smartline-api.key:/run/smartline/cert-source/smartline-api.key:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/smartline.local.crt:/run/smartline/cert-source/smartline.local.crt:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/smartline.local.key:/run/smartline/cert-source/smartline.local.key:ro
    tmpfs:
      - /run/smartline/certs:size=1m,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5047/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    ports:
      - "443:5443"
    networks: [backend]

  vision:
    build:
      context: ./SmartLine.Vision
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 8883
      MQTT_CLIENT_ID: smartline-vision
      MQTT_USERNAME: smartline-vision
      MQTT_PASSWORD: ${MQTT_VISION_PASSWORD}
      MQTT_CA_CERT_PATH: /run/smartline/certs/ca.crt
      MQTT_CLIENT_CERT_PATH: /run/smartline/certs/smartline-vision.crt
      MQTT_CLIENT_KEY_PATH: /run/smartline/certs/smartline-vision.key
      CAM_STREAM_URL: ${CAM_STREAM_URL}
      CAM_CAPTURE_URL: ${CAM_CAPTURE_URL:-}
      VISION_CONTROL_HOST: 0.0.0.0
      STILL_CAPTURE_TIMEOUT: ${STILL_CAPTURE_TIMEOUT:-30}
      MODEL_PATH: ${MODEL_PATH:-}
      MODEL_VERSION: ${MODEL_VERSION:-}
      API_BASE_URL: http://api:5047
      ALLOW_PREVIEW_FALLBACK: "false"
      LOG_LEVEL: INFO
      SHOW_PREVIEW: "false"
    volumes:
      - ./models/runtime:/opt/smartline/models:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/ca.crt:/run/smartline/cert-source/ca.crt:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/smartline-vision.crt:/run/smartline/cert-source/smartline-vision.crt:ro
      - ${SMARTLINE_CERT_DIR:-./infra/certs/generated}/smartline-vision.key:/run/smartline/cert-source/smartline-vision.key:ro
    tmpfs:
      - /run/smartline/certs:size=1m,mode=0700
    depends_on:
      mosquitto:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]


volumes:
  postgres_data:
  mosquitto_data:
  api_datasets:

networks:
  backend:
