persistence true
persistence_location /mosquitto/data/

log_dest stdout
connection_messages true
log_timestamp true

listener 8883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/runtime/passwords
acl_file /mosquitto/config/acl

cafile /mosquitto/runtime/certs/ca.crt
certfile /mosquitto/runtime/certs/mosquitto.crt
keyfile /mosquitto/runtime/certs/mosquitto.key
require_certificate true
tls_version tlsv1.2
