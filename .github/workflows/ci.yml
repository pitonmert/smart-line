name: CI

on:
  pull_request:
  push:
    branches: [main, "integration/**", "refactor/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python application and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartline_python
          POSTGRES_USER: smartline
          POSTGRES_PASSWORD: ci-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U smartline -d smartline_python"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smartline:ci-test-only@127.0.0.1:5432/smartline_python
      MQTT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and native image libraries
        run: |
          python -m pip install uv==0.13.6
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libzbar0
      - name: Install locked dependencies
        run: uv sync --frozen --extra vision
      - name: Validate application and formatting
        run: |
          uv run --frozen --extra vision smartline manage check
          uv run --frozen --extra vision smartline manage makemigrations --check --dry-run
          uv run --frozen --extra vision ruff check src tests tools/training
          uv run --frozen --extra vision ruff format --check src tests tools/training
      - name: Run domain, API, Vision, training and process tests
        run: uv run --frozen --extra vision pytest --ignore=tests/test_browser.py --junitxml=test-results/python.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results
          if-no-files-found: ignore

  dashboard:
    name: Django Dashboard browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest tests/test_browser.py --junitxml=test-results/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results
          if-no-files-found: ignore

  containers:
    name: Production images and package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --target web --tag smartline-web:ci .
      - run: docker build -f deploy/Dockerfile --target vision --tag smartline-vision:ci .
      - name: Verify production package boundaries
        run: |
          docker run --rm --entrypoint python smartline-web:ci -c "import importlib.util; assert importlib.util.find_spec('ultralytics') is None; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('cv2') is None"
          docker run --rm --entrypoint python smartline-vision:ci -c "import smartline.vision.inference; import importlib.util; assert importlib.util.find_spec('ultralytics') is None; assert importlib.util.find_spec('pytest') is None"
      - name: Verify isolated Compose startup and HTTPS
        run: python3 tests/support/stack/verify-compose.py

  firmware:
    name: Firmware PlatformIO builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Run firmware host regression tests
        run: |
          python -m unittest discover -s firmware/controller/tests -p 'test_*.py' -v
          python -m unittest discover -s firmware/camera/tests -p 'test_*.py' -v

      - name: Prepare non-secret CI firmware configuration
        run: |
          cp firmware/controller/include/Config.h.example firmware/controller/include/Config.h
          cp firmware/controller/include/MqttTlsConfig.h.example firmware/controller/include/MqttTlsConfig.h

      - name: Build firmware environment
        run: pio run --project-dir firmware/controller --environment firmware

      - name: Build sensor-test environment
        run: pio run --project-dir firmware/controller --environment sensor-test

      - name: Build ESP32-CAM environment
        env:
          WIFI_SSID: YOUR_WIFI_SSID
          WIFI_PASS: YOUR_WIFI_PASSWORD
          WIFI_STATIC_IP: 192.168.1.50
          WIFI_GATEWAY: 192.168.1.1
          WIFI_SUBNET: 255.255.255.0
        run: pio run --project-dir firmware/camera --environment esp32cam

  mqtt-security:
    name: Mosquitto TLS and ACL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_DB: smartline_ci
      POSTGRES_USER: smartline_ci
      POSTGRES_PASSWORD: ci-test-only
      MQTT_API_PASSWORD: ci-only-api-password-0000000000000000
      MQTT_FIRMWARE_PASSWORD: ci-only-firmware-password-00000000000
      MQTT_VISION_PASSWORD: ci-only-vision-password-0000000000000
      CAM_STREAM_URL: http://127.0.0.1:81/stream
      SMARTLINE_CERT_DIR: /tmp/smartline-mqtt-trusted-certs
      SMARTLINE_CERT_OUTPUT_DIR: /tmp/smartline-mqtt-trusted-certs
      SMARTLINE_MQTT_TEST_CERT_DIR: /tmp/smartline-mqtt-test-certs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate disposable CI certificates
        env:
          SMARTLINE_LAN_IP: 127.0.0.1
        run: sh deploy/certs/generate-local-ca.sh

      - name: Generate an untrusted test client certificate
        run: sh tests/support/mqtt/generate-untrusted-client.sh

      - name: Validate MQTT integration compose configuration
        run: >-
          docker compose
          -f deploy/compose.yaml
          -f tests/support/mqtt/docker-compose.mtls-test.yml
          config --quiet

      - name: Start isolated Mosquitto broker
        run: >-
          docker compose
          -f deploy/compose.yaml
          -f tests/support/mqtt/docker-compose.mtls-test.yml
          up --detach --wait --wait-timeout 60 mosquitto

      - name: Verify mutual TLS authentication and topic ACLs
        run: >-
          docker compose
          -f deploy/compose.yaml
          -f tests/support/mqtt/docker-compose.mtls-test.yml
          run --rm --no-deps mqtt-test-client

      - name: Build the Python MQTT runtime test client
        run: docker build -f deploy/Dockerfile --target web --tag smartline-web:mqtt-test .

      - name: Verify Python message delivery and reconnect
        env:
          MQTT_PASSWORD: ${{ env.MQTT_API_PASSWORD }}
        run: >-
          docker run --rm --network smartline_backend --entrypoint python
          -v "$SMARTLINE_CERT_DIR:/test-certs:ro"
          -v "$PWD/tests/support/mqtt_runtime.py:/test/mqtt_runtime.py:ro"
          -e MQTT_HOST=mosquitto -e MQTT_TEST_CERT_DIR=/test-certs
          -e MQTT_CA_CERT_PATH=/test-certs/ca.crt
          -e MQTT_CLIENT_CERT_PATH=/test-certs/smartline-api.crt
          -e MQTT_CLIENT_KEY_PATH=/test-certs/smartline-api.key
          -e MQTT_USERNAME=smartline-api -e MQTT_PASSWORD -e MQTT_FIRMWARE_PASSWORD
          smartline-web:mqtt-test /test/mqtt_runtime.py

      - name: Show broker logs after failure
        if: failure()
        run: >-
          docker compose
          -f deploy/compose.yaml
          -f tests/support/mqtt/docker-compose.mtls-test.yml
          logs mosquitto

      - name: Stop broker
        if: always()
        run: >-
          docker compose
          -f deploy/compose.yaml
          -f tests/support/mqtt/docker-compose.mtls-test.yml
          down --volumes

      - name: Remove disposable MQTT certificates
        if: always()
        run: >-
          rm -rf
          /tmp/smartline-mqtt-trusted-certs
          /tmp/smartline-mqtt-test-certs

  secrets:
    name: Gitleaks full repository scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the repository and history
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/results" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts=--all --redact=100 \
            --gitleaks-ignore-path=/repo/.github/gitleaks.ignore \
            --report-format=sarif --report-path=/results/gitleaks.sarif

      - name: Upload secret scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks/gitleaks.sarif
          if-no-files-found: ignore
